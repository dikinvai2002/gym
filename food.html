<title>Питание на двоих</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* VOICE: kitchen notebook, plain and quick at the stove or in the shop
   IDEA: a fridge-door checklist and a food diary in one
   PICTURE: the day's meal cards and the shopping list themselves
   COLOUR and TYPE: white or graphite, herb green accent, tomato red for "over"; Barlow Condensed figures
   LAYOUT: one 640px column, sticky tabs, cards stacked */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1114);--ink:light-dark(#15171a,#eef0f3);--mut:light-dark(#5d636c,#9aa1ab);--card:light-dark(#f2f3f5,#181b20);--line:light-dark(#dcdfe4,#2b2f36);--acc:light-dark(#2f7d4f,#5cc38a);--over:light-dark(#d23b2c,#ff6b5c);--blue:light-dark(#1f6fd1,#6fa8ff);--done:light-dark(#e7f3ec,#162a1f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 48px}
h1,h2,h3,.big-n{font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:30px;padding:18px 0 4px}h2{font-size:28px;margin:22px 0 8px}h3{font-size:21px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{min-height:44px;border:0;border-radius:10px;background:var(--card);font-weight:600;font-size:14px;padding:0 4px}
.tabs button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{min-height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;padding:0 16px}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:var(--over)}
.link{border:0;background:none;color:var(--blue);text-decoration:underline;padding:6px 0;min-height:36px}
input[type=text],input[type=number],input:not([type]),select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:16px;width:100%}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--acc)}
.meter.over i{background:var(--over)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--acc)}.bad{color:var(--over)}
/* day nav */
.dnav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}
.dnav button{height:44px;border:0;border-radius:10px;background:var(--card);font-size:20px}
.dnav b{text-align:center;font-family:"Barlow Condensed";font-size:22px}
/* summary */
.sum .big-n{font-size:clamp(38px,11vw,52px)}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.mac div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mac b{display:block;font-family:"Barlow Condensed";font-size:22px}
/* meal */
.meal.eaten{background:var(--done)}
.meal select{margin:8px 0}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 84px 56px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing:last-of-type{border-bottom:0}
.ing input{height:38px;text-align:right;padding:0 8px}
.ing .k{text-align:right;color:var(--mut);font-size:14px}
.mt{margin-top:8px;font-size:14px}
.eat{width:100%;margin-top:10px}
.meal.eaten .eat{background:var(--bg);color:var(--acc);border:2px solid var(--acc)}
/* toggles */
.tg{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0}
.tg input{width:24px;height:24px;accent-color:var(--acc);flex:none}
/* extras */
.exl{list-style:none;margin:0 0 10px;padding:0}
.exl li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exl li span:first-child{flex:1}
.x{border:0;background:none;color:var(--mut);font-size:14px;text-decoration:underline;min-height:36px}
.x.armed{color:var(--over)}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.wb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
/* history */
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
/* shop */
.it{display:grid;grid-template-columns:44px minmax(0,1fr) 92px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.it .cb{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center}
.it .cb svg{width:22px;height:22px;stroke:transparent;stroke-width:3;fill:none}
.it.done .cb{background:var(--acc);border-color:var(--acc)}.it.done .cb svg{stroke:#fff}
.it.done .nm{text-decoration:line-through;color:var(--mut)}
.it input{height:40px;text-align:right}
.it .q{font-size:13px;color:var(--mut)}
.it .acts{grid-column:2/4;display:flex;gap:14px;margin-top:-4px}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600}
/* recipes */
.rc h3{margin-bottom:4px}
.rc .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:8px 0}
.rc .cols div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.rc ol{margin:8px 0 0;padding-left:20px}.rc li{margin:4px 0}
.cat{font-family:"Barlow Condensed";font-size:24px;font-weight:700;margin:20px 0 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:92vw;transition:.25s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.foot .row{margin-top:8px}
.ghostbtn{display:inline-grid;place-items:center;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600;cursor:pointer}
@media(max-width:380px){.tabs button{font-size:13px}.ing{grid-template-columns:minmax(0,1fr) 72px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<h1>Питание на двоих</h1>
<nav class="tabs" aria-label="Разделы">
<button data-v="shop">Покупки</button><button data-v="rec">Рецепты</button><button data-v="me">Моё меню</button><button data-v="ira">Меню Иры</button>

<main id="view"></main>

</section>
</div>

/* ---------- nutrition ---------- */
function macro(key,g){const f=D.foods[key];return f?{k:f.k*g/100,p:f.p*g/100,f:f.f*g/100,c:f.c*g/100}:{k:0,p:0,f:0,c:0}}
function add(a,b){return{k:a.k+b.k,p:a.p+b.p,f:a.f+b.f,c:a.c+b.c}}
const Z=()=>({k:0,p:0,f:0,c:0});
function dayRec(p,d){return S.day[p][d]}
function ensureDay(p,d){if(!S.day[p][d]){const dw=new Date(d+'T12:00').getDay();S.day[p][d]={m:WEEKPLAN[dw].map(v=>({v,g:null,ok:false})),ex:[],w:0,sh:false,cr:false}}return S.day[p][d]}
function viewDay(p,d){return dayRec(p,d)||{m:WEEKPLAN[new Date(d+'T12:00').getDay()].map(v=>({v,g:null,ok:false})),ex:[],w:0,sh:false,cr:false}}
function ings(p,meal){const o=OPT[meal.v];const base=o[p];return base.map(([k,g],i)=>({k,g:meal.g&&meal.g[i]!=null?meal.g[i]:g}))}
function mealMacro(p,meal){return ings(p,meal).reduce((s,x)=>add(s,macro(x.k,x.g)),Z())}
function dayTotals(p,day){let t=Z(),plan=Z();day.m.forEach(m=>{const mm=mealMacro(p,m);plan=add(plan,mm);if(m.ok)t=add(t,mm)});
 day.ex.forEach(e=>{t=add(t,e)});if(p==='me'){plan=add(plan,SHAKE);if(day.sh)t=add(t,SHAKE)}return{t,plan}}

/* ---------- state ---------- */
let view='me',cur={me:today(),ira:today()},exSel='';
try{const v=localStorage.getItem('food-view');if(v)view=v}catch(e){}
function go(v){view=v;try{localStorage.setItem('food-view',v)}catch(e){}render();scrollTo(0,0)}

/* ---------- views ---------- */
function rMenu(p){
 const P=PERSON[p],d=cur[p],day=viewDay(p,d),{t,plan}=dayTotals(p,day);
 const dt=new Date(d+'T12:00'),isT=d===today();
 const left=(x,tg,u)=>{const r=tg-x;return Math.abs(r)<0.5?'<span class="ok">ровно</span>':r>0?`осталось ${r0(r)} ${u}`:`<span class="bad">перебор ${r0(-r)} ${u}</span>`};
 const pct=Math.min(100,t.k/P.t.k*100);
 let h=`<div class="dnav"><button data-day="-1" aria-label="Предыдущий день">‹</button><b>${isT?'Сегодня, ':''}${DOW[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()].slice(0,3)}</b><button data-day="1" aria-label="Следующий день">›</button></div>
 <div class="card sum"><div class="row"><div><div class="xs mut">Съедено за день</div><div class="big-n num">${r0(t.k)} <span class="sm mut">из ${P.t.k} ккал</span></div></div></div>
 <div class="meter${t.k>P.t.k?' over':''}"><i style="width:${pct}%"></i></div>
 <div class="sm">${left(t.k,P.t.k,'ккал')}</div>
 <div class="mac">${[['Белки','p'],['Жиры','f'],['Углеводы','c']].map(([n,k])=>`<div><span class="xs mut">${n}</span><b class="num">${r0(t[k])} / ${P.t[k]} г</b><span class="xs">${left(t[k],P.t[k],'г')}</span></div>`).join('')}</div>
 <p class="xs mut" style="margin:10px 0 0">Если съесть всё по плану: ${r0(plan.k)} ккал, белки ${r0(plan.p)} г, жиры ${r0(plan.f)} г, углеводы ${r0(plan.c)} г.</p></div>`;
 day.m.forEach((m,i)=>{const o=OPT[m.v],cat=D.meals[i];const mm=mealMacro(p,m);const li=ings(p,m);
  h+=`<section class="card meal${m.ok?' eaten':''}" data-mi="${i}"><div class="row"><h3>${CATNAME[cat.cat]}</h3><span class="sp"></span><button class="link sm" data-recipe="${o.id}">Рецепт</button></div>
  <select data-var="${i}" aria-label="Вариант: ${cat.cat}">${cat.opts.map(x=>`<option value="${x.id}"${x.id===m.v?' selected':''}>${x.id} ${esc(x.t)}</option>`).join('')}</select>
  ${li.map((x,j)=>`<div class="ing"><span>${esc(D.foods[x.k].n)}</span><input type="number" inputmode="decimal" min="0" step="5" value="${r0(x.g)}" data-g="${i}:${j}" aria-label="${esc(D.foods[x.k].n)}, граммы"><span class="k num">${r0(macro(x.k,x.g).k)} ккал</span></div>`).join('')}
  <div class="mt num"><b>${r0(mm.k)} ккал</b> · Б ${r0(mm.p)} · Ж ${r0(mm.f)} · У ${r0(mm.c)}</div>
  <button class="btn eat" data-eat="${i}">${m.ok?'Съедено ✓ (отменить)':'Отметить: съедено'}</button></section>`});
 if(P.sup)h+=`<section class="card"><h3>Добавки</h3>
  <label class="tg"><input type="checkbox" data-sup="sh"${day.sh?' checked':''}><span>Протеиновый коктейль 30 г <span class="mut sm">· 117 ккал, Б 23</span></span></label>
  <label class="tg"><input type="checkbox" data-sup="cr"${day.cr?' checked':''}><span>Креатин 5 г <span class="mut sm">· без калорий</span></span></label></section>`;
 const fopts=Object.entries(D.foods).filter(([k])=>k!=='протеин').sort((a,b)=>a[1].n.localeCompare(b[1].n,'ru'));
 h+=`<section class="card"><h3>Дополнительно съедено</h3>
 ${day.ex.length?`<ul class="exl">${day.ex.map((e,i)=>`<li><span>${esc(e.n)}${e.g?` · ${r0(e.g)} г`:''}</span><span class="num sm">${r0(e.k)} ккал · Б ${r0(e.p)}</span><button class="x" data-delex="${i}">Удалить</button></li>`).join('')}</ul>`:'<p class="sm mut" style="margin:6px 0 10px">Ничего не добавлено.</p>'}
 <select id="exf" aria-label="Продукт"><option value="">Выберите продукт…</option>${fopts.map(([k,f])=>`<option value="${k}"${k===exSel?' selected':''}>${esc(f.n)}</option>`).join('')}<option value="__own"${exSel==='__own'?' selected':''}>Своё блюдо (ввести КБЖУ)</option></select>
 ${exSel==='__own'?`<div style="margin-top:8px"><input id="exn" placeholder="Название, например «Шаурма»" aria-label="Название"><div class="g4"><input id="exk" type="number" inputmode="decimal" placeholder="Ккал" aria-label="Ккал"><input id="exp" type="number" inputmode="decimal" placeholder="Б, г" aria-label="Белки"><input id="exfa" type="number" inputmode="decimal" placeholder="Ж, г" aria-label="Жиры"><input id="exc" type="number" inputmode="decimal" placeholder="У, г" aria-label="Углеводы"></div></div>`
  :`<div class="g2" style="margin-top:8px"><input id="exg" type="number" inputmode="decimal" placeholder="Граммы" aria-label="Граммы"><button class="btn" data-act="addex">Добавить</button></div>`}
 ${exSel==='__own'?'<button class="btn" style="width:100%;margin-top:8px" data-act="addex">Добавить</button>':''}
 </section>`;
 const wp=Math.min(100,day.w/P.w*100);
 h+=`<section class="card"><div class="row"><h3>Вода</h3><span class="sp"></span><b class="num">${(day.w/1000).toFixed(2).replace('.',',')} из ${(P.w/1000).toFixed(1).replace('.',',')} л</b></div>
 <div class="meter"><i style="width:${wp}%;background:var(--blue)"></i></div>
 <div class="wb"><button class="btn alt" data-water="-250">−250 мл</button><button class="btn" data-water="250" style="background:var(--blue)">+250 мл</button><button class="btn" data-water="500" style="background:var(--blue)">+500 мл</button></div></section>`;
 const last=[];for(let i=6;i>=0;i--){const x=new Date(d+'T12:00');x.setDate(x.getDate()-i);last.push(iso(x))}
 h+=`<h2>Последние 7 дней</h2><table><thead><tr><th>День</th><th class="r">Ккал</th><th class="r">Белок</th><th class="r">Вода</th></tr></thead><tbody>${last.map(x=>{const r=dayRec(p,x);if(!r)return `<tr><td>${x.slice(8)}.${x.slice(5,7)}</td><td class="r mut" colspan="3">нет записей</td></tr>`;const {t}=dayTotals(p,r);
  return `<tr><td>${x.slice(8)}.${x.slice(5,7)}</td><td class="r num ${t.k>P.t.k+50?'bad':''}">${r0(t.k)}</td><td class="r num ${t.p<P.t.p-15?'bad':''}">${r0(t.p)} г</td><td class="r num">${(r.w/1000).toFixed(1).replace('.',',')} л</td></tr>`}).join('')}</tbody></table>
 <p class="xs mut">Цели: ${P.t.k} ккал, белки ${P.t.p} г, жиры ${P.t.f} г, углеводы ${P.t.c} г, вода ${P.w/1000} л. Красным отмечены дни с перебором калорий или недобором белка.</p>`;
 return h}
function rRec(){
 let h='<p class="sm mut" style="margin-top:0">Граммы указаны в сыром виде на одну порцию. Варианты внутри одного приёма пищи взаимозаменяемы.</p>';
 D.meals.forEach(m=>{h+=`<div class="cat">${m.cat}</div>`;m.opts.forEach(o=>{
  const t=p=>o[p].reduce((s,[k,g])=>add(s,macro(k,g)),Z());const a=t('me'),b=t('ira');
  const li=p=>o[p].map(([k,g])=>`${esc(D.foods[k].n)} — ${k==='яйцо'?r0(g/55)+' шт':r0(g)+' г'}`).join('<br>');
  h+=`<details class="card rc" id="r-${o.id}"><summary>${o.id} ${esc(o.t)}</summary>
  <div class="cols"><div><b>Вы · ${r0(a.k)} ккал, Б ${r0(a.p)}</b><br>${li('me')}</div><div><b>Ира · ${r0(b.k)} ккал, Б ${r0(b.p)}</b><br>${li('ira')}</div></div>
  <ol>${o.r.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`})});
 return h}
function weekStart(d){const x=new Date(d+'T12:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)}
function rShop(){
 const B=S.buy,act=B.items.filter(x=>!x.skip),bought=act.filter(x=>x.done).length;
 const spent=B.items.reduce((s,x)=>s+(parseFloat(String(x.price).replace(',','.'))||0),0);
 const est=act.reduce((s,x)=>s+(x.est||0),0);
 const ym=today().slice(0,7);
 const month=B.hist.filter(h=>h.d.slice(0,7)===ym).reduce((s,h)=>s+h.sum,0)+spent;
 const mp=Math.min(100,month/20000*100);
 const row=x=>`<div class="it${x.done?' done':''}" data-id="${x.id}"><button class="cb" data-buy="${x.id}" aria-label="${esc(x.n)}: куплено">${CHK}</button>
  <div><div class="nm">${esc(x.n)}</div><div class="q">${esc(x.q||'')}${x.est?` · ~${rub(x.est)}`:''}</div></div>
  <input type="number" inputmode="decimal" placeholder="₽" value="${esc(x.price)}" data-price="${x.id}" aria-label="${esc(x.n)}: цена">
  <div class="acts"><button class="x" data-skip="${x.id}">${x.skip?'Нужно купить':'Не нужно сейчас'}</button>${x.custom?`<button class="x" data-delbuy="${x.id}">Удалить</button>`:''}</div></div>`;
 const grp=(t,list)=>list.length?`<h2>${t}</h2>${list.map(row).join('')}`:'';
 let h=`<div class="card"><div class="row"><div><div class="xs mut">Куплено</div><div class="big-n num">${bought} <span class="sm mut">из ${act.length}</span></div></div><span class="sp"></span><div style="text-align:right"><div class="xs mut">Потрачено на этой неделе</div><div class="big-n num">${rub(spent)}</div></div></div>
 <p class="xs mut" style="margin:6px 0 0">Ориентир по списку: ~${rub(est)}. Вписывайте в поле справа, сколько заплатили за продукт.</p>
 <div class="row" style="margin-top:12px"><span class="sm">За ${MON[new Date().getMonth()]}: <b class="num">${rub(month)}</b> из 20 000 ₽</span></div>
 <div class="meter${month>20000?' over':''}"><i style="width:${mp}%"></i></div></div>`;
 h+=grp('Купить на этой неделе',B.items.filter(x=>!x.skip&&x.g==='week'));
 h+=grp('Запасы, которые нужны сейчас',B.items.filter(x=>!x.skip&&x.g!=='week'));
 const sk=B.items.filter(x=>x.skip);
 if(sk.length)h+=`<details class="card" style="margin-top:16px"><summary>Не нужно на этой неделе (${sk.length})</summary>${sk.map(row).join('')}</details>`;
 h+=`<div class="card"><h3>Добавить продукт</h3><div class="g2" style="margin-top:8px"><input id="nbn" placeholder="Название" aria-label="Название продукта"><input id="nbq" placeholder="Сколько" aria-label="Количество"></div><button class="btn" style="width:100%;margin-top:8px" data-act="addbuy">Добавить в список</button></div>
 <div class="card"><h3>Новая неделя</h3><p class="sm mut" style="margin:6px 0 10px">Сумма этой недели (${rub(spent)}) сохранится в истории, отметки и цены очистятся. Запасы снова уйдут в «Не нужно» — верните те, что закончились.</p><button class="btn alt" data-act="newweek" style="width:100%">Начать новую неделю</button></div>`;
 if(B.hist.length){const byM={};B.hist.forEach(x=>{const k=x.d.slice(0,7);byM[k]=(byM[k]||0)+x.sum});
  h+=`<h2>История расходов</h2><table><thead><tr><th>Неделя с</th><th class="r">Потрачено</th><th></th></tr></thead><tbody>${B.hist.slice().reverse().map((x,i)=>`<tr><td>${x.d.slice(8)}.${x.d.slice(5,7)}.${x.d.slice(0,4)}</td><td class="r num">${rub(x.sum)}</td><td class="r"><button class="x" data-delh="${B.hist.length-1-i}">Удалить</button></td></tr>`).join('')}</tbody></table>
  <table style="margin-top:12px"><thead><tr><th>Месяц</th><th class="r">Всего</th></tr></thead><tbody>${Object.keys(byM).sort().reverse().map(k=>`<tr><td>${MON[+k.slice(5)-1]} ${k.slice(0,4)}</td><td class="r num">${rub(byM[k]+(k===ym?spent:0))}</td></tr>`).join('')}</tbody></table>`}
 return h}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('#view').innerHTML=view==='shop'?rShop():view==='rec'?rRec():rMenu(view)}

/* ---------- events ---------- */
function armed(b,go){if(b.dataset.armed){go()}else{b.dataset.armed='1';b.classList.add('armed');b.textContent='Точно?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.classList.remove('armed')}},4000)}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset,p=view;
 if(d.v){go(d.v);return}
 if(d.day){const x=new Date(cur[p]+'T12:00');x.setDate(x.getDate()+ +d.day);cur[p]=iso(x);render();return}
 if(d.eat!=null){const day=ensureDay(p,cur[p]);day.m[+d.eat].ok=!day.m[+d.eat].ok;save();render();return}
 if(d.recipe){go('rec');const el=document.getElementById('r-'+d.recipe);if(el){el.open=true;el.scrollIntoView({block:'start'})}return}
 if(d.water){const day=ensureDay(p,cur[p]);day.w=Math.max(0,day.w+ +d.water);save();render();return}
 if(d.delex!=null){armed(b,()=>{const day=ensureDay(p,cur[p]);day.ex.splice(+d.delex,1);save();render()});return}
 if(d.act==='addex'){const day=ensureDay(p,cur[p]);
  if(exSel==='__own'){const n=($('#exn').value||'').trim(),num=id=>parseFloat(($(id).value||'').replace(',','.'))||0;const e={n:n||'Своё блюдо',g:0,k:num('#exk'),p:num('#exp'),f:num('#exfa'),c:num('#exc')};
   if(!e.k){$('#exk').focus();toast('Укажите хотя бы калории');return}day.ex.push(e)}
  else{if(!exSel){$('#exf').focus();toast('Выберите продукт');return}const g=parseFloat(($('#exg').value||'').replace(',','.'));if(!(g>0)){$('#exg').focus();toast('Укажите граммы');return}
   const m=macro(exSel,g);day.ex.push({n:D.foods[exSel].n,g,k:m.k,p:m.p,f:m.f,c:m.c})}
  save();exSel='';render();toast('Добавлено');return}
 if(d.buy){const x=S.buy.items.find(i=>i.id===d.buy);x.done=!x.done;save();render();return}
 if(d.skip){const x=S.buy.items.find(i=>i.id===d.skip);x.skip=!x.skip;if(x.skip)x.done=false;save();render();return}
 if(d.delbuy){armed(b,()=>{S.buy.items=S.buy.items.filter(i=>i.id!==d.delbuy);save();render()});return}
 if(d.act==='addbuy'){const n=($('#nbn').value||'').trim();if(!n){$('#nbn').focus();return}S.buy.items.push({id:'c'+Date.now().toString(36),n,q:($('#nbq').value||'').trim(),est:0,g:'week',done:false,skip:false,price:'',custom:true});save();render();toast('Добавлено в список');return}
 if(d.act==='newweek'){armed(b,()=>{const sum=S.buy.items.reduce((s,x)=>s+(parseFloat(String(x.price).replace(',','.'))||0),0);
  if(sum>0)S.buy.hist.push({d:weekStart(today()),sum:Math.round(sum)});S.buy.items.forEach(x=>{x.done=false;x.price='';x.skip=x.g==='period'});save();render();toast('Новая неделя начата')});return}
 if(d.delh!=null){armed(b,()=>{S.buy.hist.splice(+d.delh,1);save();render()});return}
 if(d.act==='backup'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'food',v:1,at:new Date().toISOString(),data:S})],{type:'application/json'}));a.download='pitanie-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Копия сохранена в загрузки');return}
});
document.addEventListener('change',ev=>{const t=ev.target,p=view,d=t.dataset;
 if(d.var!=null){const day=ensureDay(p,cur[p]);day.m[+d.var]={v:t.value,g:null,ok:false};save();render();return}
 if(d.sup){const day=ensureDay(p,cur[p]);day[d.sup]=t.checked;save();render();return}
 if(t.id==='exf'){exSel=t.value;render();const g=$('#exg')||$('#exn');if(g)g.focus();return}
 if(d.g){const [i,j]=d.g.split(':').map(Number),day=ensureDay(p,cur[p]),m=day.m[i];const v=parseFloat(String(t.value).replace(',','.'));
  if(!m.g)m.g=OPT[m.v][p].map(x=>null);m.g[j]=isNaN(v)?0:v;save();render();return}
 if(d.price){const x=S.buy.items.find(i=>i.id===d.price);x.price=t.value;if(t.value&&!x.done)x.done=true;save();render();return}
 if(t.id==='restore'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result),dd=v.data||v;if(!dd.buy||!dd.day)throw 0;S=dd;save();render();toast('Данные восстановлены')}catch(e){toast('Это не файл копии этого приложения')}};r.readAsText(t.files[0]);t.value=''}
});
load();render();
}
</script>
</body>
</html>
